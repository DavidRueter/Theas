# Theas Web Application Server
# settings.cfg  (copy SAMPLE_settings.cfg to settings.cfg and edit)

# Configuration file for Theas Server
# see: https://github.com/DavidRueter/Theas
# David Rueter (drueter@assyst.com)

# This file contains settings used by the Theas web server application.
# It is read as Python: strings must be quoted, booleans are True / False, None means "not set",
# and arithmetic such as 1024 * 1024 is allowed.  In Windows paths, use forward slashes or a raw
# string (r"C:\Theas\logs"); a plain "C:\Theas\logs" would turn \T and \l into escape sequences.
# Option names that Theas does not recognize are silently ignored, so check spelling carefully.

# Settings can also be passed in as command-line parameters (e.g. --port=8080), except when running
# as a Windows service.  Note:
#   - If --sql_server is passed on the command line, this file is NOT read at all.
#   - Otherwise this file is read after the command line, and its values override command-line values.

# This file is read from the directory where the .EXE is located.  To read it from a different
# directory, pass --settings_path on the command line (a trailing slash is optional), e.g.:
#   --settings_path=C:/Theas/files/
# This file may also set settings_path to redirect to a settings.cfg in another directory (see the
# Bootstrap section below).

# DEPLOYMENT-SPECIFIC SETTINGS
# These values are specific to a Theas instance, and must be set appropriately:
#   server_prefix, port, sql_server, sql_port, sql_user, sql_password, sql_database, sql_default_schema,
#   sql_appname, branch_code, default_resource_code, login_resource_code, login_auto_user_token,
#   session_max_idle_minutes, remember_user_token, cookie_secret_hmac, cookie_secure, log_path
# All other settings are not deployment-specific, and can be left at their defaults.


# --- Bootstrap ---

# settings_path = "C:/Theas/files/"
    # help="The path to the folder with configuration files.", type=str
    # Redirect: if set to a different directory, Theas then reads the settings.cfg in that directory too.
    # Values from that file override values from this one.  Only one redirect is followed: a settings_path
    # in the redirected file is ignored.  "" means the program directory.  Leave commented out to use only
    # this file.


# --- Web server ---

port = 8080
    # help="The TCP/IP port that the web server will listen on", type=int
    # Each Theas instance on a machine must use its own port.

server_prefix = "http://localhost:8080"
    # help="The web server address prefix to prepend to URLs that need it.", type=str


# --- Logging ---

log_path = "%TEMP%/Theas/Port{port}"
    # help="Folder for theas_debug.log and theas_trace.log.", type=str
    # Environment variables such as %TEMP% or %ProgramData% are expanded, and {port} is replaced with
    # the server port.  A relative path is relative to the program directory.  "" means <program directory>/logs.
    # The account running Theas must be able to write here.  Under Remote Desktop, %TEMP% may resolve to a
    # numbered subfolder (e.g. ...\Temp\2); the full path is printed at startup.

logging_level = 1
    # help="Controls logging.  0 to disable all, 1 to enable all, or threshold to exceed.", type=int

startup_logging = True
    # help="During startup write to Windows Event Log before log file is ready for use", type=bool

debug_trace_enabled = True
    # help="Separate from logging the debug file is useful for low-level observability", type=bool


# --- SQL connection ---

sql_server = "SomeSQLServer"
    # help="Server name of your MSSQL server (or server/instance)", type=str
    # Required.  If it is not set, Theas prints the list of options and exits.

sql_port = 1433
    # help="TCP/IP port for your MSSQL server connections", type=int

sql_database = "some_sql_database"
    # help="MSSQL default database name for SQL connections", type=str

sql_user = "some_sql_login"
    # help="MSSQL login user name for SQL connections", type=str

sql_password = "some_sql_password"
    # help="MSSQL login password for SQL connections", type=str

sql_appname = "TheasServer"
    # help="Descriptive name for SQL connections to know the name of this application", type=str

sql_default_schema = "theas"
    # help="Default SQL schema to substitute '{schema}' or 'theas.'", type=str

sql_timeout = 60
    # help="Time (in seconds) to wait for SQL results before timing out.  Zero means wait indefinitely.", type=int

sql_max_connections = 100
    # help="Maximum number of simultaneous SQL connections allowed.", type=int

full_sql_is_ok_check = True
    # help="Explicitly test SQL connection before each call.", type=bool


# --- Sessions and multi-tab ---

session_max_idle_minutes = 60
    # help="Maximum idle time (in minutes) that user sessions will remain active", type=int

session_header_name = "X-Theas-Sesstoken"
    # help="Name of HTTP header used to send session token.", type=str

use_multi_tabs = True
    # help="Support tab-specific sessions via URL-mangling.", type=bool

multi_tab_prefix = "__tid"
    # help="String to embed in URL as prefix of the tabid if using multi-tab support", type=str


# --- Login and user token ---

login_resource_code = "login"
    # help="Resource code of the login screen template", type=str

login_auto_user_token = None
    # help="User token for the default (public) login.", type=str

remember_user_token = True
    # help="Save the user token in a cookie, and automatically log user in on future visits.", type=bool


# --- Cookies ---

session_cookie_name = "theas:th:ST"
    # help="Name of cookie used to store session token.", type=str

user_cookie_name = "theas:th:UserToken"
    # help="Name of cookie used to store user token (if applicable).", type=str

session_cookie_days = 1
    # help="Number of days to remember session cookie", type=int

user_cookie_days = 30
    # help="Number of days to remember user cookie", type=int

use_secure_cookies = True
    # help="Controls SIGNING, not the browser's Secure attribute (see cookie_secure).", type=bool
    # True: cookie values are signed with the server's cookie secret, so tampered or forged values are
    # rejected.  Values are still readable, not encrypted.  Changing this invalidates existing cookies.

cookie_secret_hmac = "replace_with_a_long_random_secret"
    # help="HMAC secret used to sign cookies (if enabled)", type=str
    # Use a long random value unique to this instance, and keep it private, e.g. the output of:
    #   python -c "import secrets; print(secrets.token_urlsafe(32))"
    # Changing this invalidates existing cookies.

cookie_secure = True
    # help="Controls the browser's Secure attribute, not signing.", type=bool
    # True: the browser stores and sends cookies only over HTTPS (or http://localhost).  Keep True when
    # users reach Theas through an HTTPS load balancer / reverse proxy, even though Theas itself speaks HTTP.
    # Set False only for an instance that is browsed directly over plain HTTP from other machines
    # (e.g. testing); otherwise the browser silently drops the session cookie and logins fail.

cookie_samesite = "Lax"
    # help="Lax, Strict, or None. Controls whether the browser sends on requests that start from another site.", type=str
    # Note: this is the string "None", not Python None.  "None" also requires cookie_secure = True.


# --- Request handling ---

default_resource_code = "index"
    # help="Resource code to use when a resource is not specified (i.e. like index.htm)", type=str

branch_code = None
    # help="Preferred resource branch to serve, falling back to default (None) as needed", type=str

force_redir_after_post = True
    # help="After a POST, perform a redirect even if no update was requested.", type=bool

use_worker_threads = True
    # help="Indicates if individual requests should be processed in their own thread.", type=bool

max_worker_threads = 30
    # help="If use_worker_threads is true, indicates the maximum number of worker threads allowed.", type=int


# --- Cache ---

max_cache_item_size = 1024 * 1024 * 100
    # help="Maximum size in bytes of item that is allowed to be stored in cache.", type=int
    # i.e. max of 100 MB per item

max_cache_size = 1024 * 1024 * 1024 * 2
    # help="Maximum total amount of bytes to use for cache storage.", type=int
    # i.e. Use a maximum of 2 GB of cache total
